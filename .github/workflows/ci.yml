name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kontrollera katalog, mallar och sidor
        run: make check

      - name: Appen ska starta
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/sitemap.xml > /dev/null
          curl -sf http://127.0.0.1:8000/robots.txt > /dev/null
          echo "appen svarar"
